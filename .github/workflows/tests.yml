name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: macos-latest       # the app targets macOS, so test there
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run tests (Qt draws offscreen; no mic, camera or window needed)
        run: python -m pytest -v
        env:
          QT_QPA_PLATFORM: offscreen
